name: Validação da Tradução

on:
  push:
    branches: [ main ]
    paths:
      - 'enGB.json'
      - 'glossario.json'
  pull_request:
    branches: [ main ]
    paths:
      - 'enGB.json'
      - 'glossario.json'

jobs:
  validar-json:
    name: Validar estrutura do JSON
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar JSON válido
        run: python3 -c "import json; json.load(open('enGB.json')); print('JSON valido')"

      - name: Validar estrutura e tags
        run: python3 scripts/validate.py

      - name: Verificar glossario.json válido
        run: python3 -c "import json; json.load(open('glossario.json')); print('Glossario valido')"

  atualizar-stats:
    name: Atualizar estatísticas no README
    runs-on: ubuntu-latest
    needs: validar-json
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Calcular progresso e atualizar badge no README
        run: |
          python3 - << 'PYEOF'
          import json, re

          with open('enGB.json', encoding='utf-8') as f:
              trad = json.load(f)

          TAG_RE = re.compile(r'\{[^}]+\}|<[^>]+>')
          total = len(trad['strings'])
          traduzidas = 0
          en_markers = re.compile(r'\b(the|and|is|are|was|were|will|have|has|this|that|with|from|they)\b', re.IGNORECASE)
          pt_markers = re.compile(r'\b(de|da|do|em|para|um|uma|com|que|não|são|você)\b', re.IGNORECASE)

          for v in trad['strings'].values():
              clean = TAG_RE.sub('', v['Text']).strip()
              if len(clean) <= 5:
                  traduzidas += 1
              elif not (en_markers.search(clean) and not pt_markers.search(clean)):
                  traduzidas += 1

          pct = round(traduzidas / total * 100, 1)
          print(f"Progresso: {traduzidas:,}/{total:,} ({pct}%)")

          # Atualizar linha de status no README
          readme = open('README.md', encoding='utf-8').read()
          novo = f'> **Status:** {pct}% traduzido — {traduzidas:,} de {total:,} strings.'
          readme_atualizado = re.sub(
              r'> \*\*Status:\*\* .*? strings\.',
              novo,
              readme
          )
          if readme_atualizado != readme:
              open('README.md', 'w', encoding='utf-8').write(readme_atualizado)
              print("README.md atualizado com novo progresso.")
          else:
              print("README.md sem alterações.")
          PYEOF

      - name: Commit stats atualizadas (se mudou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (
            git add README.md &&
            git commit -m "chore(ci): atualiza progresso de tradução no README [skip ci]" &&
            git push
          )

  relatorio-qualidade:
    name: Relatório de qualidade
    runs-on: ubuntu-latest
    needs: validar-json
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerar relatório de qualidade
        run: python3 scripts/relatorio.py --output relatorio_pr.txt

      - name: Exibir relatório no log
        run: cat relatorio_pr.txt

      - name: Upload relatório como artefato
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-qualidade
          path: relatorio_pr.txt
          retention-days: 30

  score-pr:
    name: Score de qualidade do PR
    runs-on: ubuntu-latest
    needs: validar-json
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - name: Checkout do PR (branch atual)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Calcular score ANTES e DEPOIS
        id: score
        run: |
          python3 - << 'PYEOF'
          import json, re, subprocess, os

          TAG_RE = re.compile(r'\{[^}]+\}|<[^>]+>')
          EN_RE = re.compile(r'\b(the|and|is|are|was|were|will|have|has|this|that|with|from|they)\b', re.IGNORECASE)
          PT_RE = re.compile(r'\b(de|da|do|em|para|um|uma|com|que|não|são|você)\b', re.IGNORECASE)

          def score_json(path):
              with open(path, encoding='utf-8') as f:
                  data = json.load(f)
              strings = data['strings']
              total = len(strings)
              traduzidas = 0
              for v in strings.values():
                  clean = TAG_RE.sub('', v['Text']).strip()
                  if len(clean) <= 5:
                      traduzidas += 1
                  elif not (EN_RE.search(clean) and not PT_RE.search(clean)):
                      traduzidas += 1
              pct = round(traduzidas / total * 100, 2) if total else 0
              return traduzidas, total, pct

          # Score DEPOIS (branch do PR)
          trad_depois, total, pct_depois = score_json('enGB.json')

          # Score ANTES (branch main)
          result = subprocess.run(
              ['git', 'show', 'origin/main:enGB.json'],
              capture_output=True
          )
          trad_antes = pct_antes = 0
          if result.returncode == 0:
              import tempfile
              with tempfile.NamedTemporaryFile(mode='wb', suffix='.json', delete=False) as tmp:
                  tmp.write(result.stdout)
                  tmp_path = tmp.name
              trad_antes, _, pct_antes = score_json(tmp_path)
              import os; os.unlink(tmp_path)

          delta_strings = trad_depois - trad_antes
          delta_pct = round(pct_depois - pct_antes, 2)
          sinal = '+' if delta_strings >= 0 else ''

          comment = f"""## Relatório de Qualidade da Tradução

          | Métrica | Antes (main) | Depois (PR) | Delta |
          |---------|-------------|-------------|-------|
          | Strings traduzidas | {trad_antes:,} | {trad_depois:,} | {sinal}{delta_strings:,} |
          | % traduzido | {pct_antes}% | {pct_depois}% | {sinal}{delta_pct}% |
          | Total de strings | {total:,} | {total:,} | — |

          {'✅ Este PR melhora a tradução.' if delta_strings >= 0 else '⚠️ Este PR reduz o número de strings traduzidas.'}
          """

          # Escrever para output do GitHub Actions
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"comment<<EOF\n{comment}\nEOF\n")

          print(f"Score: {pct_antes}% → {pct_depois}% ({sinal}{delta_pct}%)")
          PYEOF

      - name: Comentar no PR com score
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `${{ steps.score.outputs.comment }}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const bot_comment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Relatório de Qualidade da Tradução')
            );
            if (bot_comment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: bot_comment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

  verificar-termos:
    name: Verificar termos proibidos
    runs-on: ubuntu-latest
    needs: validar-json
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar se o PR introduz novos termos proibidos
        run: |
          python3 - << 'PYEOF'
          import json, re, sys

          with open('enGB.json', encoding='utf-8') as f:
              data = json.load(f)

          # Termos que nunca devem aparecer em texto PT-BR
          forbidden = [
              (r'\bAP\b', 'AP deveria ser PA'),
              (r'\bMP\b', 'MP deveria ser PM'),
              (r'\bcooldown\b', 'cooldown deveria ser recarga'),
          ]

          issues = []
          for uuid, entry in data['strings'].items():
              text = entry['Text']
              for pat, msg in forbidden:
                  # Ignora dentro de tags
                  clean = re.sub(r'\{[^}]+\}', '', text)
                  if re.search(pat, clean, re.IGNORECASE):
                      issues.append(f"  [{uuid[:8]}] {msg}: {text[:80]}")

          if issues:
              print(f"AVISO: {len(issues)} ocorrências de termos não padronizados:")
              for i in issues[:20]:
                  print(i)
              # Não falha o CI — apenas avisa (use sys.exit(1) para tornar bloqueante)
          else:
              print("Nenhum termo não padronizado encontrado.")
          PYEOF
